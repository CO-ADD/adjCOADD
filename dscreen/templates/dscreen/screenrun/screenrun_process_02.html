
<a
  class="addReadouts"
  href="{% url 'add_readouts' pk=object.run_id %}"
  data-popup-url="{% url 'add_readouts' pk=object.run_id %}"
  >Add Readouts</a>

<a class="btn" data-bs-toggle="modal" data-bs-target="add_readouts" data-bs-toggle="tooltip"
data-bs-placement="right" title="Add ReadOuts">
<i class="bi text-danger fs-6"></i>
</a>


<div class="modal fade" id="drug_detail_del" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog">
    <!--prettier-ignore-->

    <div class="modal-content card-bg">
        <div class="modal-header">
            <h5 class="modal-title">AddReadouts</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form method="POST" class="post-form" action="'add_readouts' pk={{object.pk}}">
            <div class="modal-body">
            <!--prettier-ignore-->
                {% csrf_token %}
            </div>
                <div class="modal-footer d-flex justify-content-center align-center">
                <button type="submit" class="p-0 border border-0 m-auto bg-transparent text-center" name="note">
                    <i class="fa-regular fa-trash-can text-danger fs-6"></i>
                </button>
            {% include 'utils/miscellaneous/cancel_btn.html' %}
            </div>
        </form>
    </div>

  </div>
</div>
