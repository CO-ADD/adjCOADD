
#TestPlates: {{ object.n_testplates }}
{% comment %} TestPlates: {{ object.n_testplates}}
MotherPlates: {{ object.n_motherplates}}
[Url: {{url}} ] 
<button type="submit" id="add_readouts" class="btn btn-primary", 
   form="ScreenUpdateForm" formmethod="post" name="action" value="add_readouts">Add Readouts</button> 

 <a type="button"
    id="addReadouts" 
    class="btn" 
    data-bs-toggle="modal" 
    data-bs-placement="right"
    text="Add Readouts" data-bs-target="#addReadoutsModal">
  </a>

<button data-toggle="modal" data-target="#addReadouts" class="btn btn-primary">Readouts</button>


<script>
  $(document).ready(function () {
    const csrftoken = getCookie("csrftoken");
    loadModal("#addReadoutsModal", "#addReadouts", "{% url 'add_readouts' pk=object.run_id %}");
  });
</script>
{% endcomment %}

<a
  class="addReadouts"
  href="{% url 'add_readouts' pk=object.run_id %}"
  data-popup-url="{% url 'add_readouts' pk=object.run_id %}"
  >Add Readouts
</a>

<div id="popup" class="modal fade" role="dialog">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-info" data-dismiss="modal">Close
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  $(document).on("click", ".addReadouts", function (e) {
    e.preventDefault();
    var $popup = $("#popup");
    var popup_url = $(this).data("popup-url");
    $(".modal-body", $popup).load(popup_url, function () {
      $popup.modal("show");
    });
  });
</script>
