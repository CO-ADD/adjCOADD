<span hx-swap-oob="innerHTML:#info-title"><i class="bi bi-check-circle me-2"></i>Saved</span>

<div class="text-center py-3">
  <i class="bi bi-check-circle-fill text-success" style="font-size: 2rem;"></i>
  <p class="mt-2 mb-3">{{ save_message|default:'Saved successfully.' }}</p>
  <button type="button" class="btn btn-primary" data-bs-dismiss="modal"
          onclick="window.location.reload();">Close</button>
</div>

<script>
  // Auto-close the modal and refresh the page shortly after saving so the
  // updated record (sequence, list, etc.) is shown without a manual click.
  setTimeout(function () {
    var modalEl = document.getElementById('infoModal');
    var modal = bootstrap.Modal.getInstance(modalEl);
    if (modal) { modal.hide(); }
    window.location.reload();
  }, 1200);
</script>
