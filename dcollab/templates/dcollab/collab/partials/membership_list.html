<div class="card mb-4">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>Group Members</span>
    <button
      type="button"
      class="btn btn-sm btn-outline-primary"
      hx-get="{% url 'add-member' object.pk %}"
      hx-target="#membership-rows"
      hx-swap="beforeend">
      + Add Member
    </button>
  </div>

  <div class="card-body" id="membership-rows">
    {{ membership_formset.management_form }}
    {% for formset_form in membership_formset %}
      {% include "dcollab/collab/partials/membership_row.html" with form=formset_form %}
    {% endfor %}
  </div>
</div>
