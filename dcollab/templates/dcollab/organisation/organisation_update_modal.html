<span hx-swap-oob="innerHTML:#info-title"><i class="bi bi-pencil-square me-2"></i>Update Organisation <small class="text-muted">/ {{ object.pk }}</small></span>

<form method="POST" action="{% url 'organisation_update' object.pk %}">
  {% csrf_token %}

  <div style="max-height: 55vh; overflow-y: auto; padding-right: .25rem;">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
      {% for field in form.visible_fields %}
        <div class="col">
          <label class="form-label mb-1">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}
            <div class="text-danger small">{{ error }}</div>
          {% endfor %}
        </div>
      {% endfor %}
    </div>
  </div>

  <div class="d-flex justify-content-center gap-2 pt-3 mt-3 border-top">
    <button type="submit" class="btn btn-primary">Save</button>
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
  </div>
</form>
