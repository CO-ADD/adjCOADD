<tr class="editing">

      type="submit"
      value="update"
      hx-put="{%url 'organisation_update' pk=object.pk%}"

      hx-trigger="click">
        <i>Save</i>
    </button>
    {% include 'utils/miscellaneous/cancel_btn_reloc.html' %}

  {% endfor%}
</tr>
