<div class="row">
  <div class="col-md-3">
    {% if object.reg_molfile %}
      {% with molblock_id="molblock-"|add:object.pk %}
        {{ object.reg_molfile|json_script:molblock_id }}
        <div id="structure{{ object.pk }}" class="molecule-structure-molblock d-flex justify-content-center"
             data-molblock-id="{{ molblock_id }}"></div>
      {% endwith %}
    {% else %}
      <div class="text-muted small text-center py-3">No structure</div>
    {% endif %}
  </div>
  <div class="col-md-9">
    <div class="row">
      {% for group in display_groups %}
        <div class="col-md-4">
          <table class="table table-hover table-sm align-middle table-bordered">
            <tbody>
              {% for row in group %}
                <tr>
                  <th scope="row" class="table-label-col">{{ row.label }}</th>
                  <td>{{ row.value }}</td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
