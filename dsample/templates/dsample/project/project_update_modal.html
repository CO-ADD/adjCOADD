<span hx-swap-oob="innerHTML:#info-title"><i class="bi bi-pencil-square me-2"></i>Update Project <small class="text-muted">/ {{ object.pk }}</small></span>

<form method="POST" action="{% url 'project_update' object.pk %}">
  {% csrf_token %}

  <div style="max-height: 55vh; overflow-y: auto; padding-right: .25rem;">
    {% for group in form.groups %}
      <div class="mb-3">
        <table class="table table-hover table-sm align-middle table-bordered mb-0">
          <tbody>
            {% for field in group %}
              <tr>
                <th scope="row" class="align-middle table-label-col">{{ field.label }}</th>
                <td class="align-middle">
                  {{ field }}
                  {% for error in field.errors %}
                    <div class="text-danger small">{{ error }}</div>
                  {% endfor %}
                </td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    {% endfor %}
  </div>

  <div class="d-flex justify-content-center gap-2 pt-3 mt-3 border-top">
    <button type="submit" class="btn btn-primary">Save</button>
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
  </div>
</form>
