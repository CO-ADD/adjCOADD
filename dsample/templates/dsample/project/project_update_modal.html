<form method="POST" action="{% url 'project_update' object.pk %}">
  {% csrf_token %}

  <div class="d-flex align-items-center pb-3 mb-3 border-bottom">
    <i class="bi bi-pencil-square text-primary me-2"></i>
    <div class="lh-sm">
      <div class="fw-bold">Update Project</div>
      <div class="text-muted small text-break">{{ object.pk }}</div>
    </div>
  </div>

  <div style="max-height: 55vh; overflow-y: auto; padding-right: .25rem;">
    {% for group in form.groups %}
      <div class="mb-3">
        <table class="table table-hover table-sm align-middle table-bordered mb-0">
          <tbody>
            {% for field in group %}
              <tr>
                <th scope="row" class="align-middle w-25">{{ field.label }}</th>
                <td class="align-middle">
                  {{ field }}
                  {% for error in field.errors %}
                    <div class="text-danger small">{{ error }}</div>
                  {% endfor %}
                </td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    {% endfor %}
  </div>

  <div class="d-flex justify-content-center gap-2 pt-3 mt-3 border-top">
    <button type="submit" class="btn btn-primary">Save</button>
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
  </div>
</form>
