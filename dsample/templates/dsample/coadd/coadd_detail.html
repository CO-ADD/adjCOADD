{% extends 'base.html' %}
{% block title %}COADD{% endblock %}

{% block content %}
<div class="d-flex vh-100">

  <div class="leftbar d-flex flex-column p-0 bg-light" style="width: 2em;">
    <div class="d-flex flex-column p-0">
      <a href="{% url 'coadd_list' %}" class="border-0 text-success bg-transparent"
         data-bs-toggle="tooltip" data-bs-placement="right" title="Back to List">
        <i class="fa-solid fa-table-list fs-5"></i>
      </a>

      <a href="#" id="coadd-structure-edit-btn" class="border-0 text-success bg-transparent"
         data-bs-toggle="tooltip" data-bs-placement="right" title="Edit Structure">
        <i class="bi bi-pencil-square fs-5"></i>
      </a>
    </div>
  </div>

  <div class="w-100">

    <div class="accordion bg-transparent" id="coadd-detail">
      <div class="accordion-item">
        <h2 class="accordion-header" id="heading_00">
          <button class="accordion-button" style="max-height:100px;" type="button" data-bs-toggle="collapse"
                  data-bs-target="#collapse_00" aria-expanded="true" aria-controls="collapse_00">
            <h5 class="fs-4 my-0">
              <b>{{ object.compound_id }}</b> | <i>{{ object.compound_name }}</i>
            </h5>
          </button>
        </h2>
        <div id="collapse_00" class="accordion-collapse collapse show bg-transparent" aria-labelledby="heading_00"
             data-bs-parent="#coadd-detail">
          <div class="accordion-body bg-transparent">
            {% include 'dsample/coadd/coadd_display.html' %}
            <hr>
            {% include 'detailview/audit_status.html' %}
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

{% include 'utils/molecule_structure.html' %}

<!-- Ketcher structure editor modal -->
<div id="structureModal" class="modal fade" tabindex="-1" aria-hidden="true"></div>

<script>
  $(document).ready(function () {
    loadModal(
      "#structureModal",
      "#coadd-structure-edit-btn",
      "{% url 'coadd_structure_edit' object.pk %}"
    );
  });
</script>

{% endblock %}
