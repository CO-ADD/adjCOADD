<div class="row">
  <div class="col-md-3">
    {% if object.std_smiles %}
      <div id="structure{{ object.pk }}" class="molecule-structure-svg d-flex justify-content-center"
           data-smiles="{{ object.std_smiles }}"></div>
    {% else %}
      <div class="text-muted small text-center py-3">No structure</div>
    {% endif %}
    <div class="d-flex justify-content-center mt-2">
      <a href="#" id="coadd-structure-edit-btn" class="btn btn-sm btn-outline-success"
         title="Edit Structure">
        <i class="bi bi-pencil-square me-1"></i>Edit Structure
      </a>
    </div>
  </div>
  <div class="col-md-9">
    <div class="row">
      {% for group in display_groups %}
        <div class="col-md-4">
          <table class="table table-hover table-sm align-middle table-bordered">
            <tbody>
              {% for row in group %}
                <tr>
                  <th scope="row" class="table-label-col">{{ row.label }}</th>
                  <td>{{ row.value }}</td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
