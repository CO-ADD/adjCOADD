<tr class="editing">
  <td>
    <button class="border border-0 bg-transparent"
      type="button"
      value="update"
      hx-put="{% url 'menuitem_update' object.pk %}"
      hx-include="closest tr"
      hx-trigger="click"
      title="Save">
      <i class="fa-solid fa-check text-success"></i>
    </button>
    <button type="button" class="border border-0 bg-transparent"
      hx-put="{% url 'menuitem_update' object.pk %}?_value=cancel"
      hx-trigger="click"
      title="Cancel">
      <i class="fa-solid fa-xmark text-danger"></i>
    </button>
  </td>
  {% for field in form %}
  <td>{{ field }}</td>
  {% endfor %}
</tr>
