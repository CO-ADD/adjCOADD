{% load static %}
<div class="card card-bg my-2">
  <div class="card-header d-flex flex-wrap align-items-center gap-2 py-2">
    <span class="fw-semibold"><i class="bi bi-grid-3x3-gap me-2"></i>Plate Map</span>
    <div class="btn-group btn-group-sm" id="plate-map-metrics" role="group" aria-label="Heatmap property"></div>
    <div class="form-check form-switch ms-2 mb-0">
      <input class="form-check-input" type="checkbox" id="plate-map-highlight" checked>
      <label class="form-check-label small" for="plate-map-highlight">Highlight compound wells</label>
    </div>
    <div class="d-flex align-items-center gap-1 ms-auto" id="plate-map-legend"></div>
  </div>
  <div class="card-body py-2">
    <div class="plate-map-scroll">
      <div id="plate-map-grid" class="plate-map-grid"></div>
    </div>
    <div class="text-muted small mt-2" id="plate-map-status"></div>
  </div>
</div>
<div id="plate-map-tooltip" class="plate-map-tooltip" hidden></div>

{{ plate_map_data|json_script:"plate-map-data" }}
<script src="{% static 'js/plate_map.js' %}"></script>
