{% load static %}
<div class="card card-bg">
  <div class="card-header d-flex flex-wrap align-items-center gap-3 py-2">
    <i class="bi bi-grid-3x3-gap fs-5" title="Plate Map"></i>
    <div class="btn-group btn-group-sm" id="plate-map-metrics" role="group" aria-label="Heatmap property"></div>
    <div class="flex-fill d-flex justify-content-center align-items-center flex-wrap gap-1" id="plate-map-type-legend"></div>
    <div class="d-flex align-items-center gap-1" id="plate-map-legend"></div>
  </div>
  <div class="card-body py-2">
    <div class="plate-map-scroll">
      <div id="plate-map-grid" class="plate-map-grid"></div>
    </div>
    <div class="text-muted small mt-2" id="plate-map-status"></div>
  </div>
</div>
<div id="plate-map-tooltip" class="plate-map-tooltip" hidden></div>

{{ plate_map_data|json_script:"plate-map-data" }}
<script src="{% static 'js/plate_map.js' %}"></script>
