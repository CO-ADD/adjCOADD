<div class="accordion bg-transparent" id="plate-info-accordion">
  <div class="accordion-item">
    <h2 class="accordion-header" id="plate-info-heading">
      <button class="accordion-button" type="button" data-bs-toggle="collapse"
              data-bs-target="#plate-info-collapse" aria-expanded="true" aria-controls="plate-info-collapse">
        <span class="fw-semibold"><i class="bi bi-clipboard-data me-2"></i>Plate Info</span>
      </button>
    </h2>
    <div id="plate-info-collapse" class="accordion-collapse collapse show" aria-labelledby="plate-info-heading">
      <div class="accordion-body p-2">
        <table class="table table-sm table-bordered align-middle mb-2">
          <tbody>
            <tr>
              <th class="table-label-col">Assay ID</th>
              <td>{{ plate_info.assay_id }}</td>
            </tr>
            <tr>
              <th class="table-label-col">ZFactor</th>
              <td>{{ plate_info.zfactor }}</td>
            </tr>
            <tr>
              <th class="table-label-col">PosCtrl</th>
              <td>{{ plate_info.poscontrol }}</td>
            </tr>
            <tr>
              <th class="table-label-col">NegCtrl</th>
              <td>{{ plate_info.negcontrol }}</td>
            </tr>
            <tr>
              <th class="table-label-col">Sample</th>
              <td>{{ plate_info.sample }}</td>
            </tr>
            <tr>
              <th class="table-label-col">Edge</th>
              <td>{{ plate_info.edge }}</td>
            </tr>
          </tbody>
        </table>

        <form method="POST" action="{% url 'testplate_quality_update' object.pk %}">
          {% csrf_token %}
          <label class="form-label small mb-1" for="plate_quality">Plate Quality</label>
          <select name="plate_quality" id="plate_quality" class="form-select">
            {% for value, label, cls in plate_info.quality_choices %}
            <option value="{{ value }}" class="{{ cls }}" {% if value == plate_info.plate_quality %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
          <button type="submit" class="btn btn-sm btn-primary w-100 mt-2">Save Quality</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    var sel = document.getElementById('plate_quality');
    if (!sel) { return; }
    function update() {
      var opt = sel.options[sel.selectedIndex];
      sel.className = 'form-select ' + (opt ? (opt.className || '') : '');
    }
    update();
    sel.addEventListener('change', update);
  })();
</script>
