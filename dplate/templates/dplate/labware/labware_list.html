{% extends 'base.html' %}
{% block title %}COADD{% endblock %}

{% block content %}
<div class="d-flex flex-row vh-100">
  <!-- Sidebar View/Buttons -->
  <div class="leftbar d-flex flex-column p-0 mb-3 h-25">
    <div class="d-flex flex-column p-0">
      <a class="btn-sm" id="hidefilter" data-bs-toggle="tooltip" data-bs-placement="right" title="C/O FilterSwitcher">
        <i class="bi bi-funnel fs-5"></i>
      </a>

      <a href="{% url list_url %}" class="btn btn-sm" data-bs-toggle="tooltip" data-bs-placement="right" title="Table View">
        <i class="fa-solid fa-table-list fs-5"></i>
      </a>
    </div>
  </div>

  <!-- Filterbar View/Filter -->
  {% include "utils/sidebar.html" %}

  <!-- Main View -->
  <div class="d-flex flex-column w-100">
    <div class="contain-fluid data-contain">
      {% include 'datatable/datatable_pag_action_inrow.html' with model_name=model_name update_url=update_url row_template=row_template %}
    </div>
  </div>
</div>
{% endblock %}
