      <div class="modal-content" id="update-content">

        <div class="modal-header">
          <h5 class="modal-title" id="update-title"> Update {{model_name}}</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body" id="update-body">
          <!-- HTMX will load content here -->
          Form loading ...

          </div> {% endcomment %}

        </div>

      </div>
  </div>
</div>
