<table id="{{table_id}}" class="table-bg" style="width: 100%">
  <thead>
    <tr>
      
      {% for col in data_df_fields %}
        <th>{{col}}</th>
      {% endfor %}
    </tr>
  </thead>
  <tbody hx-target="closest tr" hx-swap="outerHTML">
    {% for row in data_df %}
    <!--  -->
    {{row.Index}}
      <tr>
        
        {% for cell in row %}
          <td>{{cell}}</td>
        {% endfor%}
      </tr>
    <!--  -->
    {% endfor %}
  </tbody>
</table>
